services:
  # Base de Datos MySQL
  mysql-db:
    image: mysql:8.0
    container_name: mysql-db
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: inventory_db
    ports:
      - "3306:3306"
    networks:
      - smartlogix-net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Servidor Eureka
  eureka-server:
    image: smartlogix-microservicios-poms-eureka-server
    container_name: eureka-server
    ports:
      - "8761:8761"
    networks:
      - smartlogix-net

  # Broker de Mensajería RabbitMQ
  rabbitmq:
    image: rabbitmq:4.2-management
    container_name: rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    networks:
      - smartlogix-net
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  # API Gateway
  api-gateway:
    image: smartlogix-microservicios-poms-api-gateway
    container_name: api-gateway
    ports:
      - "8080:8080"
    depends_on:
      - eureka-server
    networks:
      - smartlogix-net

  # Microservicio de Inventario
  inventory-service:
    build:
      context: ./storechainparent
      dockerfile: Dockerfile
      args:
        JAR_FILE: microservices/inventory/target/*.jar
    container_name: inventory-service
    ports:
      - "8089:8086" # Expone el puerto 8086 interno hacia el 8089
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql-db:3306/inventory_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
      SPRING_RABBITMQ_HOST: rabbitmq
    depends_on:
      mysql-db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      eureka-server:
        condition: service_started
    networks:
      - smartlogix-net

  # Frontend
  smartlogix-frontend:
    image: smartlogix-microservicios-poms-frontend
    container_name: smartlogix-frontend
    ports:
      - "80:80"
    depends_on:
      - api-gateway
    networks:
      - smartlogix-net

networks:
  smartlogix-net:
    driver: bridge
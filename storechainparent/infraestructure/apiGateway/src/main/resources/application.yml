server:
  port: 8080

spring:
  cloud:
    gateway:
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOrigins:
              - "http://localhost"
              - "http://localhost:80"
              - "http://localhost:5173"
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
            allowedHeaders: "*"
            allowCredentials: true
      routes:

        - id: inventory_service
          uri: lb://microservices-inventory
          predicates:
            - Path=/api/inventory/**
          filters:
            - StripPrefix=1

        - id: order_service
          uri: lb://microservices-order
          predicates:
            - Path=/api/order/**
          filters:
            - StripPrefix=1

        - id: shipment_service
          uri: lb://microservices-shipment
          predicates:
            - Path=/api/shipment/**
          filters:
            - StripPrefix=1

        - id: bff_service
          uri: lb://microservices-bff
          predicates:
            - Path=/api/bff/**
          filters:
            - StripPrefix=1

management:
  endpoints:
    web:
      exposure:
        include: health,info